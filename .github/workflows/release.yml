name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or retry
        required: true
        type: string
        default: v0.1.0
permissions:
  contents: read
concurrency:
  group: maven-central-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.event.release.tag_name) }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Apache Maven 3.9.16
        run: |
          set -euo pipefail
          TASK_TOOLS="$RUNNER_TEMP/jmux-maven"
          mkdir -p "$TASK_TOOLS"
          URL="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz"
          curl -fsSL --retry 3 "$URL" -o "$TASK_TOOLS/maven.tar.gz"
          curl -fsSL --retry 3 "$URL.sha512" -o "$TASK_TOOLS/maven.sha512"
          EXPECTED="$(tr -d '[:space:]' < "$TASK_TOOLS/maven.sha512")"
          [[ "$EXPECTED" =~ ^[0-9a-fA-F]{128}$ ]]
          printf '%s  %s\n' "$EXPECTED" "$TASK_TOOLS/maven.tar.gz" | sha512sum --check
          tar -xzf "$TASK_TOOLS/maven.tar.gz" -C "$TASK_TOOLS"
          echo "$TASK_TOOLS/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          "$TASK_TOOLS/apache-maven-3.9.16/bin/mvn" --version
      - name: Validate release coordinates and tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          GROUP="$(mvn -q help:evaluate -Dexpression=project.groupId -DforceStdout)"
          if [[ "$VERSION" == *-SNAPSHOT || "$RELEASE_TAG" != "v$VERSION" || "$GROUP" != io.github.ghosthack ]]; then
            echo "::error::Expected io.github.ghosthack coordinates and a matching non-SNAPSHOT release tag"
            exit 1
          fi
      - name: Build and test release artifacts without credentials
        run: ./scripts/build.sh -Prelease -Dgpg.skip=true
      - run: python3 scripts/verify-release.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.event.release.tag_name) }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Install Apache Maven 3.9.16
        run: |
          set -euo pipefail
          TASK_TOOLS="$RUNNER_TEMP/jmux-maven"
          mkdir -p "$TASK_TOOLS"
          URL="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz"
          curl -fsSL --retry 3 "$URL" -o "$TASK_TOOLS/maven.tar.gz"
          curl -fsSL --retry 3 "$URL.sha512" -o "$TASK_TOOLS/maven.sha512"
          EXPECTED="$(tr -d '[:space:]' < "$TASK_TOOLS/maven.sha512")"
          [[ "$EXPECTED" =~ ^[0-9a-fA-F]{128}$ ]]
          printf '%s  %s\n' "$EXPECTED" "$TASK_TOOLS/maven.tar.gz" | sha512sum --check
          tar -xzf "$TASK_TOOLS/maven.tar.gz" -C "$TASK_TOOLS"
          echo "$TASK_TOOLS/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          "$TASK_TOOLS/apache-maven-3.9.16/bin/mvn" --version
      - name: Sign and publish to Maven Central
        run: mvn -B -ntp clean deploy -Prelease
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - run: python3 scripts/verify-release.py --signatures
