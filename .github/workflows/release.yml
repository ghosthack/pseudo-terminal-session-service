name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: maven-central-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate release coordinates and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          GROUP="$(mvn -q help:evaluate -Dexpression=project.groupId -DforceStdout)"
          if [[ "$VERSION" == *-SNAPSHOT || "$RELEASE_TAG" != "v$VERSION" || "$GROUP" != io.github.ghosthack ]]; then
            echo "::error::Expected io.github.ghosthack coordinates and a matching non-SNAPSHOT release tag"
            exit 1
          fi
      - name: Build and test release artifacts without credentials
        run: ./scripts/build.sh -Prelease -Dgpg.skip=true
      - run: python3 scripts/verify-release.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Sign and publish to Maven Central
        run: mvn -B -ntp clean deploy -Prelease
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - run: python3 scripts/verify-release.py --signatures
